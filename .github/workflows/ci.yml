name: build deps

on: [push, pull_request]

jobs:
  # ------------------------------------------------------------------ hlsdl
  # Linux only - the deps feed is always cross-compiled for Linux and the
  # bundled makefile has no macOS openssl handling.
  hlsdl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: install deps
        run: sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev libssl-dev ffmpeg
      - name: make
        run: make -C hlsdl
      - name: TS stream (AES-128, muxed)
        run: |
          timeout 180 ./hlsdl/hlsdl -b -o test.ts "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8"
          echo "6bf11a9a4be02443d4790e43e6569a614128bad453c5cb327ec74031f6ea6382  test.ts" | sha256sum -c
      # Needs the current hlsdl (EXT-X-MAP support). Against the old bundled
      # 0.26 this step fails - that is the point.
      - name: fMP4 stream (EXT-X-MAP + BYTERANGE)
        run: |
          set -eux
          # the -b variant (v9) carries #EXT-X-MAP:URI="main.mp4",BYTERANGE="721@0"
          # into a ~585 MB progressive file; a broken quote-skip makes hlsdl pull
          # that whole file in as the "init segment" AND append the byte ranges.
          timeout 300 ./hlsdl/hlsdl -b -o test_fmp4.mp4 "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"
          test -s test_fmp4.mp4
          dd if=test_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          bytes=$(stat -c%s test_fmp4.mp4)
          test "$bytes" -gt 50000000
          test "$bytes" -lt 800000000
          # ffprobe reads the whole file; -b muxes the default audio rendition,
          # but fMP4 + separate audio is written video-only, so a leaked audio
          # init segment is the only way an audio stream shows up here
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 test_fmp4.mp4 > streams.txt
          cat streams.txt
          grep -qE '^video' streams.txt
          ! grep -qE '^audio' streams.txt
      # Locally generated fixtures - deterministic, no network. Split into one
      # step per case so a failure points straight at the fixture that broke.
      - name: fixture - fMP4 EXT-X-MAP (separate init file)
        run: |
          set -eux
          mkdir fx && cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=6:s=128x72 -c:v libx264 -g 15 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 fmp4.m3u8
          cat fmp4.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_fmp4.mp4 fmp4.m3u8
          dd if=out_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          test "$(grep -a -o ftyp out_fmp4.mp4 | wc -l)" -eq 1
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_fmp4.mp4 | grep -q video
      - name: fixture - single-file fMP4 (EXT-X-MAP BYTERANGE, local path)
        run: |
          set -eux
          cd fx
          # concat the init + fragments into one file and hand-write a byte-range
          # playlist: #EXT-X-MAP:URI="blob.mp4",BYTERANGE="<n>@0" (quoted, unlike
          # #EXT-X-BYTERANGE). A broken quote-skip reads size 0 -> local 404.
          segs=$(grep -v '^#' fmp4.m3u8)
          cat init.mp4 $segs > blob.mp4
          isz=$(stat -c%s init.mp4)
          {
            printf '#EXTM3U\n#EXT-X-VERSION:7\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
            printf '#EXT-X-MAP:URI="blob.mp4",BYTERANGE="%d@0"\n' "$isz"
            off=$isz
            for s in $segs; do
              sz=$(stat -c%s "$s")
              printf '#EXTINF:1.0,\n#EXT-X-BYTERANGE:%d@%d\nblob.mp4\n' "$sz" "$off"
              off=$((off + sz))
            done
            printf '#EXT-X-ENDLIST\n'
          } > sf.m3u8
          cat sf.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_sf.mp4 sf.m3u8
          dd if=out_sf.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          # hlsdl just re-reads the byte ranges in order -> exactly blob.mp4
          cmp -s out_sf.mp4 blob.mp4
      - name: fixture - live fMP4, -s 0 keeps the EXT-X-MAP
        run: |
          set -eux
          cd fx
          # a live playlist (no ENDLIST); 2 s segments so -i 1 stops hlsdl
          # cleanly (exit 0, file flushed) right after the first trimmed
          # segment instead of spinning until a timeout kill
          sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' fmp4.m3u8 > live_fmp4.m3u8
          cat live_fmp4.m3u8
          python3 -m http.server 8199 &
          srv=$!
          sleep 1
          timeout 30 ../hlsdl/hlsdl -f -s 0 -i 1 -e 1 -o out_live_fmp4.mp4 "http://127.0.0.1:8199/live_fmp4.m3u8" || true
          kill $srv 2>/dev/null || true
          ls -l out_live_fmp4.mp4
          # -i 1 stops hlsdl right after the init segment, before the first
          # trimmed media segment is written -> the output must be exactly the
          # EXT-X-MAP init. A broken trim frees that head and the output starts
          # with a media fragment (styp / no ftyp) instead.
          dd if=out_live_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          cmp -s out_live_fmp4.mp4 init.mp4
      - name: fixture - repeated and changing EXT-X-MAP (VOD, live refresh, live -s trim)
        run: |
          set -eux
          cd fx
          segs=$(grep -v '^#' fmp4.m3u8)
          test "$(echo $segs | wc -w)" -ge 2
          s0=$(echo $segs | cut -d' ' -f1)
          hdr7='#EXTM3U\n#EXT-X-VERSION:7\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n'
          # VOD: the map repeated before every segment, once under another URL
          # with the same bytes - the init must be in the file exactly once
          cp init.mp4 init_copy.mp4
          {
            printf "$hdr7"
            n=0
            for s in $segs; do
              if [ $n -eq 1 ]; then
                printf '#EXT-X-DISCONTINUITY\n#EXT-X-MAP:URI="init_copy.mp4"\n'
              else
                printf '#EXT-X-MAP:URI="init.mp4"\n'
              fi
              printf '#EXTINF:2.0,\n%s\n' "$s"
              n=$((n + 1))
            done
            printf '#EXT-X-ENDLIST\n'
          } > rep.m3u8
          cat rep.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_rep.mp4 rep.m3u8
          cmp out_rep.mp4 out_fmp4.mp4
          # a second, different init
          ffmpeg -v error -f lavfi -i testsrc2=d=4:s=96x64 -c:v libx264 -g 15 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename init2.mp4 \
                 -hls_segment_filename 'b%d.m4s' fmp4b.m3u8
          ! cmp -s init.mp4 init2.mp4
          b0=$(grep -v '^#' fmp4b.m3u8 | sed -n 1p)
          b1=$(grep -v '^#' fmp4b.m3u8 | sed -n 2p)
          test -n "$b1"
          python3 -m http.server 8201 &
          srv=$!
          printf "$hdr7" > live_map.m3u8
          printf '#EXT-X-MAP:URI="init.mp4"\n#EXTINF:2.0,\n%s\n' "$s0" >> live_map.m3u8
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8201/live_map.m3u8 && break
            sleep 0.5
          done
          # live: a new init after a discontinuity, right in front of the new
          # segment - the refresh used to drop it
          timeout 30 ../hlsdl/hlsdl -f -s 30 -e 1 -o out_live_map.mp4 "http://127.0.0.1:8201/live_map.m3u8" 2>live_map.log &
          dl=$!
          # change the playlist only once hlsdl is through the first window
          for _ in $(seq 40); do
            grep -q 'Downloading part 0' live_map.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXT-X-DISCONTINUITY\n#EXT-X-MAP:URI="init2.mp4"\n#EXTINF:2.0,\n%s\n#EXT-X-ENDLIST\n' "$b0" >> live_map.m3u8
          rc=0
          wait $dl || rc=$?
          # live -s: the window holds two inits and the start lies after the
          # second - the trim used to keep the first one
          {
            printf "$hdr7"
            printf '#EXT-X-MAP:URI="init.mp4"\n#EXTINF:2.0,\n%s\n' "$s0"
            printf '#EXT-X-DISCONTINUITY\n#EXT-X-MAP:URI="init2.mp4"\n#EXTINF:2.0,\n%s\n#EXTINF:2.0,\n%s\n' "$b0" "$b1"
          } > live_trim.m3u8
          # -s 1 starts at the last segment, -i 1 stops right after its init
          timeout 30 ../hlsdl/hlsdl -f -s 1 -i 1 -e 1 -o out_live_trim.mp4 "http://127.0.0.1:8201/live_trim.m3u8" || true
          kill $srv 2>/dev/null || true
          test "$rc" -eq 0
          cat init.mp4 "$s0" init2.mp4 "$b0" > ref_live_map.mp4
          cmp out_live_map.mp4 ref_live_map.mp4
          cmp out_live_trim.mp4 init2.mp4
      - name: fixture - TS with a mid-stream EXT-X-DISCONTINUITY
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video -f mpegts d0.ts
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video -f mpegts d1.ts
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=64x48  -c:v mpeg2video -f mpegts d2.ts
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nd0.ts\n#EXTINF:1.0,\nd1.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nd2.ts\n#EXT-X-ENDLIST\n' > disc.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_disc.ts disc.m3u8
          ffprobe -v error -show_entries format=format_name -of csv=p=0 out_disc.ts | grep -q .
      - name: fixture - TS segments disguised as images (VOD + live)
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=3:s=64x48 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'img%d.ts' img.m3u8
          # every segment gets an image in front of the TS data (a WEBP or a
          # PNG head, alternating) and an image-like name, as on image CDNs
          for f in $(grep '\.ts$' img.m3u8); do
            n=${f#img}; n=${n%.ts}
            if [ $((n % 2)) -eq 0 ]; then
              printf 'RIFF\042\000\000\000WEBPVP8L\025\000\000\000\057\000\000\000\020\007\020\021\021\210\210\376\007\000' > "dis$n.image"
            else
              printf '\211PNG\r\n\032\n\000\000\000\015IHDR\000\000\000\001\000\000\000\001\010\006\000\000\000\037\025\304\211' > "dis$n.image"
            fi
            cat "$f" >> "dis$n.image"
          done
          sed 's/^img\([0-9]*\)\.ts$/dis\1.image/' img.m3u8 > dis.m3u8
          cat dis.m3u8
          # VOD: the image heads are cut off -> the same bytes as the plain TS
          timeout 60 ../hlsdl/hlsdl -f -o ref_img.ts img.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_dis.ts dis.m3u8 2>dis.log
          cat dis.log
          grep -q 'disguised as images' dis.log
          cmp out_dis.ts ref_img.ts
          # live: the same cut in the live writer
          sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' dis.m3u8 > live_dis.m3u8
          python3 -m http.server 8198 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8198/live_dis.m3u8 && break
            sleep 0.5
          done
          # VOD over HTTP: curl.c used to cut 16 bytes off every PNG-headed
          # segment (and read 16 bytes past the buffer), which left the rest of
          # the PNG head in front of the TS data
          timeout 60 ../hlsdl/hlsdl -f -o out_dis_http.ts "http://127.0.0.1:8198/dis.m3u8"
          cmp out_dis_http.ts ref_img.ts
          # -s 30: start at the first segment (the window is ~3 s), -i 2 ends
          # cleanly after 2 s of media instead of waiting for new segments
          timeout 30 ../hlsdl/hlsdl -f -s 30 -i 2 -e 1 -o out_live_dis.ts "http://127.0.0.1:8198/live_dis.m3u8" || true
          kill $srv 2>/dev/null || true
          ls -l out_live_dis.ts
          test "$(head -c 1 out_live_dis.ts | od -An -tx1 | tr -d ' \n')" = 47
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_live_dis.ts | grep -q video
      - name: fixture - TS video + separate audio playlist (A/V merge)
        run: |
          set -eux
          cd fx
          # video-only and audio-only TS playlists; hlsdl -a muxes them into
          # one TS via find_first_ts_packet + merge_packets
          ffmpeg -v error -f lavfi -i testsrc=d=3:s=128x72 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'v%d.ts' vplaylist.m3u8
          ffmpeg -v error -f lavfi -i sine=f=440:d=3 -c:a mp2 \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'a%d.ts' aplaylist.m3u8
          timeout 60 ../hlsdl/hlsdl -f -a aplaylist.m3u8 -o out_av.ts vplaylist.m3u8
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_av.ts | sort -u > av.txt
          cat av.txt
          grep -q video av.txt
          grep -q audio av.txt
      - name: fixture - AES-128 with EXT-X-MAP before EXT-X-KEY
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=2:s=64x48 -c:v libx264 -g 15 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename ki.mp4 ki.m3u8
          head -c 16 /dev/urandom > enc.key
          KEYHEX=$(xxd -p -c 32 enc.key)
          IV=000102030405060708090a0b0c0d0e0f
          seg=$(grep -v '^#' ki.m3u8 | head -1)
          openssl aes-128-cbc -e -K "$KEYHEX" -iv "$IV" -in ki.mp4 -out ki.mp4.enc
          openssl aes-128-cbc -e -K "$KEYHEX" -iv "$IV" -in "$seg"  -out seg0.enc
          {
            printf '#EXTM3U\n#EXT-X-VERSION:5\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
            printf '#EXT-X-MAP:URI="ki.mp4.enc"\n'
            printf '#EXT-X-KEY:METHOD=AES-128,URI="enc.key",IV=0x%s\n' "$IV"
            printf '#EXTINF:2.0,\nseg0.enc\n#EXT-X-ENDLIST\n'
          } > mapkey.m3u8
          cat mapkey.m3u8
          timeout 30 ../hlsdl/hlsdl -f -o out_mapkey.mp4 mapkey.m3u8
          # the init segment must come out decrypted (ftyp box), not ciphertext
          dd if=out_mapkey.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
      - name: fixture - AES-128 IV in upper case, IV before URI
        run: |
          set -eux
          cd fx
          # RFC 8216 writes the IV hex digits in upper case and the attributes may
          # come in any order; a wrong IV only breaks the first 16 bytes of each
          # segment, i.e. exactly the ftyp box checked below
          IVU=A1B2C3D4E5F60718293A4B5C6D7E8F90
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 enc.key)" -iv "$IVU" -in ki.mp4 -out ki_u.mp4.enc
          {
            printf '#EXTM3U\n#EXT-X-VERSION:5\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
            printf '#EXT-X-MAP:URI="ki_u.mp4.enc"\n'
            printf '#EXT-X-KEY:METHOD=AES-128,IV=0X%s,URI="enc.key",KEYFORMAT="identity"\n' "$IVU"
            printf '#EXTINF:2.0,\nseg0_u.enc\n#EXT-X-ENDLIST\n'
          } > mapkey_u.m3u8
          seg=$(grep -v '^#' ki.m3u8 | head -1)
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 enc.key)" -iv "$IVU" -in "$seg" -out seg0_u.enc
          cat mapkey_u.m3u8
          timeout 30 ../hlsdl/hlsdl -f -o out_mapkey_u.mp4 mapkey_u.m3u8
          dd if=out_mapkey_u.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
      - name: fixture - key rotation, METHOD=NONE and a key without IV
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=6:s=64x48 -c:v mpeg2video -g 25 \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'rk%d.ts' rk_src.m3u8
          test "$(grep -c '\.ts$' rk_src.m3u8)" -ge 4
          head -c 16 /dev/urandom > k1.key
          head -c 16 /dev/urandom > k2.key
          IV2=0F0E0D0C0B0A09080706050403020100
          # segment 1 under k1 with the implicit IV (its media sequence number),
          # segment 3 under k2 with an explicit IV; 0 and 2 are in the clear
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 k1.key)" -iv 00000000000000000000000000000001 -in rk1.ts -out rk1.enc
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 k2.key)" -iv "$IV2" -in rk3.ts -out rk3.enc
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n'
          {
            printf "$hdr"
            printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk1.ts\n#EXTINF:1.0,\nrk2.ts\n#EXTINF:1.0,\nrk3.ts\n#EXT-X-ENDLIST\n'
          } > rk_plain.m3u8
          # the last method used to apply to every segment (rk0 got "decrypted"),
          # and the IV search ran on into the next EXT-X-KEY line (k1 took IV2)
          {
            printf "$hdr"
            printf '#EXTINF:1.0,\nrk0.ts\n'
            printf '#EXT-X-KEY:METHOD=AES-128,URI="k1.key"\n#EXTINF:1.0,\nrk1.enc\n'
            printf '#EXT-X-KEY:METHOD=NONE\n#EXTINF:1.0,\nrk2.ts\n'
            printf '#EXT-X-KEY:METHOD=AES-128,URI="k2.key",IV=0x%s\n#EXTINF:1.0,\nrk3.enc\n' "$IV2"
            printf '#EXT-X-ENDLIST\n'
          } > rk.m3u8
          cat rk.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o ref_rk.ts rk_plain.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_rk.ts rk.m3u8
          cmp out_rk.ts ref_rk.ts
      - name: fixture - master playlist with CRLF, a variant without RESOLUTION, no final newline
        run: |
          set -eux
          cd fx
          # CRLF used to leave a \r in the variant URL. The variant list is
          # built in reverse, so -W looks at the one without RESOLUTION first -
          # that used to end the search with "No resolution match found".
          printf '#EXTM3U\r\n#EXT-X-STREAM-INF:BANDWIDTH=200000,RESOLUTION=64x48\r\nrk_plain.m3u8\r\n#EXT-X-STREAM-INF:BANDWIDTH=100000\r\nrk_plain.m3u8\r\n' > crlf_master.m3u8
          timeout 60 ../hlsdl/hlsdl -f -W 100 -o out_crlf.ts crlf_master.m3u8
          cmp out_crlf.ts ref_rk.ts
          # a variant URL on the last line without a newline used to be dropped
          printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=100000\nrk_plain.m3u8' > nonl_master.m3u8
          timeout 60 ../hlsdl/hlsdl -f -b -o out_nonl.ts nonl_master.m3u8
          cmp out_nonl.ts ref_rk.ts
      - name: fixture - live playlist that ends without new segments
        run: |
          set -eux
          cd fx
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk1.ts\n' > live_end.m3u8
          { cat live_end.m3u8; printf '#EXT-X-ENDLIST\n'; } > live_end_vod.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o ref_end.ts live_end_vod.m3u8
          python3 -m http.server 8199 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8199/live_end.m3u8 && break
            sleep 0.5
          done
          timeout 30 ../hlsdl/hlsdl -f -s 30 -e 1 -o out_end.ts "http://127.0.0.1:8199/live_end.m3u8" 2>live_end.log &
          dl=$!
          # change the playlist only once hlsdl is through the first window
          for _ in $(seq 40); do
            grep -q 'Downloading part 1' live_end.log && break
            sleep 0.5
          done
          sleep 1
          # the stream ends with no new segment: hlsdl used to wait forever on
          # the empty queue (here: until the timeout kills it, exit 124)
          printf '#EXT-X-ENDLIST\n' >> live_end.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          test "$rc" -eq 0
          cmp out_end.ts ref_end.ts
      - name: fixture - an unusable key and a full disk fail the download
        run: |
          set -eux
          cd fx
          # a key of the wrong length used to leave an all-zero key -> garbage, exit 0
          head -c 15 /dev/urandom > short.key
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-KEY:METHOD=AES-128,URI="short.key"\n#EXTINF:1.0,\nrk1.enc\n#EXT-X-ENDLIST\n' > badkey.m3u8
          if timeout 30 ../hlsdl/hlsdl -f -o out_badkey.ts badkey.m3u8; then
            echo "hlsdl reported success without a usable key" >&2; exit 1
          fi
          # output that could not be written used to end with exit code 0
          if timeout 30 ../hlsdl/hlsdl -o - rk_plain.m3u8 > /dev/full; then
            echo "hlsdl reported success although nothing could be written" >&2; exit 1
          fi
      - name: fixture - unreachable segment fails the download
        run: |
          set -eux
          cd fx
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\ndoes-not-exist.ts\n#EXT-X-ENDLIST\n' > broken.m3u8
          # a segment that cannot be fetched must give a non-zero exit
          if timeout 30 ../hlsdl/hlsdl -f -o out_broken.ts broken.m3u8; then
            echo "hlsdl reported success for an unreachable segment" >&2
            exit 1
          fi
      - name: fixture - -I skips a segment that cannot be fetched
        run: |
          set -eux
          cd fx
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n'
          { printf "$hdr"; printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nmissing.ts\n#EXTINF:1.0,\nrk2.ts\n#EXT-X-ENDLIST\n'; } > gap.m3u8
          { printf "$hdr"; printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk2.ts\n#EXT-X-ENDLIST\n'; } > gap_ref.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o ref_gap.ts gap_ref.m3u8
          # without -I the gap fails the download, with -I it is left out
          if timeout 60 ../hlsdl/hlsdl -f -w 0 -o out_gap.ts gap.m3u8; then
            echo "expected the download with a missing segment to fail" >&2; exit 1
          fi
          timeout 60 ../hlsdl/hlsdl -f -w 0 -I -o out_gap.ts gap.m3u8 2>gap.log
          cat gap.log
          grep -q '1 of 3 segments were skipped' gap.log
          cmp out_gap.ts ref_gap.ts
          # nothing fetched at all is still a failure
          { printf "$hdr"; printf '#EXTINF:1.0,\nmissing.ts\n#EXT-X-ENDLIST\n'; } > allgap.m3u8
          if timeout 60 ../hlsdl/hlsdl -f -w 0 -I -o out_allgap.ts allgap.m3u8; then
            echo "-I reported success although no segment was downloaded" >&2; exit 1
          fi
          # -R cannot tell a skipped gap from the finished part
          if timeout 30 ../hlsdl/hlsdl -f -R -I -o out_ri.ts gap_ref.m3u8 2>ri.log; then
            echo "-R together with -I was accepted" >&2; exit 1
          fi
          grep -q 'cannot be combined' ri.log
      - name: fixture - EXT-X-KEY / EXT-X-MAP attributes in any order, unusable responses
        run: |
          set -eux
          cd fx
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n'
          # METHOD not first, and an empty attribute value in front of URI
          {
            printf "$hdr"
            printf '#EXTINF:1.0,\nrk0.ts\n'
            printf '#EXT-X-KEY:KEYFORMATVERSIONS="",URI="k1.key",METHOD=AES-128\n#EXTINF:1.0,\nrk1.enc\n'
            printf '#EXT-X-KEY:METHOD=NONE\n#EXTINF:1.0,\nrk2.ts\n'
            printf '#EXT-X-KEY:IV=0x0F0E0D0C0B0A09080706050403020100,URI="k2.key",METHOD=AES-128\n#EXTINF:1.0,\nrk3.enc\n'
            printf '#EXT-X-ENDLIST\n'
          } > rk_order.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_rk_order.ts rk_order.m3u8
          cmp out_rk_order.ts ref_rk.ts
          # BYTERANGE before URI on EXT-X-MAP
          sed 's/^#EXT-X-MAP:URI="blob.mp4",BYTERANGE="\([0-9@]*\)"$/#EXT-X-MAP:BYTERANGE="\1",URI="blob.mp4"/' sf.m3u8 > sf_order.m3u8
          grep -q '^#EXT-X-MAP:BYTERANGE=' sf_order.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_sf_order.mp4 sf_order.m3u8
          cmp out_sf_order.mp4 blob.mp4
          # an empty segment body is a failed transfer (local files cannot show
          # this - an empty local file is already a 404)
          : > empty.ts
          { printf "$hdr"; printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nempty.ts\n#EXTINF:1.0,\nrk2.ts\n#EXT-X-ENDLIST\n'; } > empty.m3u8
          python3 -m http.server 8200 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8200/empty.m3u8 && break
            sleep 0.5
          done
          rc_empty=0
          timeout 60 ../hlsdl/hlsdl -f -w 0 -o out_empty.ts "http://127.0.0.1:8200/empty.m3u8" || rc_empty=$?
          timeout 60 ../hlsdl/hlsdl -f -w 0 -I -o out_empty_i.ts "http://127.0.0.1:8200/empty.m3u8"
          # init segment over HTTP: without Range support the server answers
          # 200 with the whole file, which must not be written as the init segment
          range_code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1 http://127.0.0.1:8200/blob.mp4)
          rc_sf=0
          timeout 60 ../hlsdl/hlsdl -f -w 0 -o out_sf_http.mp4 "http://127.0.0.1:8200/sf.m3u8" 2>sf_http.log || rc_sf=$?
          kill $srv 2>/dev/null || true
          test "$rc_empty" -ne 0
          cmp out_empty_i.ts ref_gap.ts
          cat sf_http.log
          if [ "$range_code" = 206 ]; then
            test "$rc_sf" -eq 0
            cmp out_sf_http.mp4 blob.mp4
          else
            test "$rc_sf" -ne 0
            grep -q 'does not match its byte range' sf_http.log
          fi
      - name: fixture - interrupted VOD download resumes to the same bytes
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=5:s=64x48 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'rs%d.ts' rs_full.m3u8
          n=$(grep -c '\.ts$' rs_full.m3u8)
          test "$n" -ge 4
          # reference: a clean full download
          timeout 60 ../hlsdl/hlsdl -f -o ref.ts rs_full.m3u8
          # interrupt without touching the playlist: make the 3rd segment
          # briefly unreadable (a real interruption is a transfer failure, not
          # a playlist edit - and a playlist edit is what the fingerprint is
          # meant to catch)
          seg3=$(grep '\.ts$' rs_full.m3u8 | sed -n 3p)
          chmod 000 "$seg3"
          if timeout 60 ../hlsdl/hlsdl -f -R -w 1 -o out.ts rs_full.m3u8; then
            echo "expected the interrupted run to fail" >&2; exit 1
          fi
          test -s out.ts.hlsdl.resume
          grep -q '^hlsdl-resume 2$' out.ts.hlsdl.resume
          grep -q '^done 2$' out.ts.hlsdl.resume
          cp out.ts.hlsdl.resume saved.resume
          # clear the fault and resume against the same playlist
          chmod 644 "$seg3"
          timeout 60 ../hlsdl/hlsdl -R -o out.ts rs_full.m3u8 2>resume.log
          # cmp alone cannot tell a resume from a fresh restart - check it really resumed
          grep -q '^Resuming: 2/' resume.log || { echo "::error::TS run did not resume: $(tail -n 5 resume.log | tr '\n' '|')"; exit 1; }
          test ! -e out.ts.hlsdl.resume
          cmp ref.ts out.ts
          # "already complete" no-op: the real sidecar bumped to done == total
          cp ref.ts out2.ts
          sed "s/^done .*/done $n/;s/^bytes .*/bytes $(stat -c%s ref.ts)/" saved.resume > out2.ts.hlsdl.resume
          timeout 30 ../hlsdl/hlsdl -R -o out2.ts rs_full.m3u8 2>noop.txt
          test ! -e out2.ts.hlsdl.resume
          cmp ref.ts out2.ts
          # ... and reports the finished size, so a status-only frontend does not see 0
          grep -q "\"d_s\":$(stat -c%s ref.ts)" noop.txt
          # a sidecar from a different playlist (same segment count) is refused
          ffmpeg -v error -f lavfi -i testsrc=d=5:s=48x32 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'other%d.ts' other.m3u8
          test "$(grep -c '\.ts$' other.m3u8)" -eq "$n"
          timeout 60 ../hlsdl/hlsdl -f -o other_ref.ts other.m3u8
          cp saved.resume other_out.ts.hlsdl.resume
          timeout 60 ../hlsdl/hlsdl -f -R -o other_out.ts other.m3u8 2>warn.txt
          grep -qi 'does not match' warn.txt
          test ! -e other_out.ts.hlsdl.resume
          cmp other_ref.ts other_out.ts
      - name: fixture - resume survives per-request query tokens in the segment URLs
        run: |
          set -eux
          cd fx
          # every failed check leaves its context in an ::error:: annotation
          fail() { echo "::error::token fixture: $1 :: sidecar=[$(tr '\n' ' ' < tok_out.ts.hlsdl.resume 2>&1)] :: log1=[$(tail -n 5 tok1.log 2>&1 | tr '\n' '|')] :: log2=[$(tail -n 5 tok2.log 2>&1 | tr '\n' '|')]"; exit 1; }
          (python3 -m http.server 8197 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          # one playlist URL whose content changes between the runs: only the signed
          # query token on every segment differs (the stored segment URL embeds the
          # playlist's own path, so the playlist file name has to stay the same)
          sed 's#\(rs[0-9]*\.ts\)$#\1?token=AAAA#' rs_full.m3u8 > tok.m3u8
          grep -q 'rs0.ts?token=AAAA' tok.m3u8 || fail "sed did not add the tokens"
          curl -sf http://127.0.0.1:8197/tok.m3u8 > /dev/null || fail "test server not reachable"
          seg3=$(grep '\.ts$' rs_full.m3u8 | sed -n 3p)
          # break the 3rd segment (the server answers 404 for an unreadable file)
          chmod 000 "$seg3"
          rc=0
          timeout 60 ../hlsdl/hlsdl -f -R -w 1 -o tok_out.ts http://127.0.0.1:8197/tok.m3u8 2>tok1.log || rc=$?
          [ "$rc" -ne 0 ] || fail "the interrupted run did not fail"
          grep -q '^done 2$' tok_out.ts.hlsdl.resume || fail "no sidecar with done 2 after the interrupted run (rc=$rc)"
          chmod 644 "$seg3"
          # second run with different tokens must still resume, not start over
          sed 's#\(rs[0-9]*\.ts\)$#\1?token=BBBB#' rs_full.m3u8 > tok.m3u8
          rc=0
          timeout 60 ../hlsdl/hlsdl -R -o tok_out.ts http://127.0.0.1:8197/tok.m3u8 2>tok2.log || rc=$?
          [ "$rc" -eq 0 ] || fail "the second run failed (rc=$rc)"
          grep -q '^Resuming: 2/' tok2.log || fail "the second run did not resume"
          test ! -e tok_out.ts.hlsdl.resume || fail "sidecar left behind"
          cmp ref.ts tok_out.ts || fail "output differs from the reference"
          pkill -f 'http.server 8197' || true
      - name: fixture - resume is refused when the playlist really changed
        run: |
          set -eux
          cd fx
          fail() { echo "::error::changed-playlist fixture: $1 :: log=[$(tail -n 5 chg.log 2>&1 | tr '\n' '|')]"; exit 1; }
          seg3=$(grep '\.ts$' rs_full.m3u8 | sed -n 3p)
          # (1) same segment URLs, one segment duration different
          chmod 000 "$seg3"
          rc=0
          timeout 60 ../hlsdl/hlsdl -f -R -w 1 -o dur_out.ts rs_full.m3u8 2>chg.log || rc=$?
          [ "$rc" -ne 0 ] || fail "the interrupted run did not fail"
          grep -q '^done 2$' dur_out.ts.hlsdl.resume || fail "no sidecar with done 2"
          chmod 644 "$seg3"
          sed '0,/^#EXTINF:[0-9.]*,/s//#EXTINF:7.000000,/' rs_full.m3u8 > rs_dur.m3u8
          ! cmp -s rs_full.m3u8 rs_dur.m3u8 || fail "sed did not change a duration"
          timeout 60 ../hlsdl/hlsdl -f -R -o dur_out.ts rs_dur.m3u8 2>chg.log
          grep -qi 'does not match' chg.log || fail "a changed duration did not refuse the resume"
          cmp ref.ts dur_out.ts
          # (2) same segment URLs, a different variant (bandwidth / resolution) picked
          #     by -b; the master keeps its URL, only its content changes
          (python3 -m http.server 8197 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=1000000,RESOLUTION=64x48\nrs_full.m3u8\n' > master.m3u8
          curl -sf http://127.0.0.1:8197/master.m3u8 > /dev/null || fail "test server not reachable"
          chmod 000 "$seg3"
          rc=0
          timeout 60 ../hlsdl/hlsdl -f -R -b -w 1 -o var_out.ts http://127.0.0.1:8197/master.m3u8 2>chg.log || rc=$?
          [ "$rc" -ne 0 ] || fail "the interrupted variant run did not fail"
          grep -q '^done 2$' var_out.ts.hlsdl.resume || fail "no variant sidecar with done 2"
          chmod 644 "$seg3"
          printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=2000000,RESOLUTION=128x96\nrs_full.m3u8\n' > master.m3u8
          timeout 60 ../hlsdl/hlsdl -f -R -b -o var_out.ts http://127.0.0.1:8197/master.m3u8 2>chg.log
          grep -qi 'does not match' chg.log || fail "a different variant did not refuse the resume"
          cmp ref.ts var_out.ts
          pkill -f 'http.server 8197' || true
      - name: fixture - interrupted fMP4 (EXT-X-MAP) download resumes
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=5:s=64x48 -c:v mpeg4 \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename rfi.mp4 \
                 -hls_segment_filename 'rf%d.m4s' rf_full.m3u8
          m=$(grep -c '\.m4s$' rf_full.m3u8)
          test "$m" -ge 4
          timeout 60 ../hlsdl/hlsdl -f -o rf_ref.mp4 rf_full.m3u8
          seg3=$(grep '\.m4s$' rf_full.m3u8 | sed -n 3p)
          chmod 000 "$seg3"
          if timeout 60 ../hlsdl/hlsdl -f -R -w 1 -o rf_out.mp4 rf_full.m3u8; then
            echo "expected the interrupted fMP4 run to fail" >&2; exit 1
          fi
          grep -q '^map 1$' rf_out.mp4.hlsdl.resume
          grep -q '^done 2$' rf_out.mp4.hlsdl.resume
          chmod 644 "$seg3"
          timeout 60 ../hlsdl/hlsdl -R -o rf_out.mp4 rf_full.m3u8 2>rf_resume.log
          grep -q '^Resuming: 2/' rf_resume.log || { echo "::error::fMP4 run did not resume: $(tail -n 5 rf_resume.log | tr '\n' '|')"; exit 1; }
          test ! -e rf_out.mp4.hlsdl.resume
          cmp rf_ref.mp4 rf_out.mp4
          # exactly one ftyp: the init segment was not re-written on resume
          test "$(grep -a -o ftyp rf_out.mp4 | wc -l)" -eq 1
      - name: fixture - interrupted resume on the -a A/V-merge path
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=4:s=128x72 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'mv%d.ts' mv.m3u8
          ffmpeg -v error -f lavfi -i sine=f=440:d=4 -c:a mp2 \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'ma%d.ts' ma.m3u8
          test "$(grep -c '\.ts$' mv.m3u8)" -ge 3
          timeout 60 ../hlsdl/hlsdl -f -a ma.m3u8 -o mav_ref.ts mv.m3u8
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 mav_ref.ts | sort -u > mav.txt
          grep -q video mav.txt
          grep -q audio mav.txt
          v3=$(grep '\.ts$' mv.m3u8 | sed -n 3p)
          chmod 000 "$v3"
          if timeout 60 ../hlsdl/hlsdl -f -R -w 1 -a ma.m3u8 -o mav_out.ts mv.m3u8; then
            echo "expected the interrupted -a run to fail" >&2; exit 1
          fi
          test -s mav_out.ts.hlsdl.resume
          chmod 644 "$v3"
          timeout 60 ../hlsdl/hlsdl -R -a ma.m3u8 -o mav_out.ts mv.m3u8 2>mav_resume.log
          grep -q '^Resuming: 2/' mav_resume.log || { echo "::error::-a run did not resume: $(tail -n 5 mav_resume.log | tr '\n' '|')"; exit 1; }
          test ! -e mav_out.ts.hlsdl.resume
          test -s mav_out.ts
          # both streams are still there after the resume splice
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 mav_out.ts | sort -u > mav_out.txt
          grep -q video mav_out.txt
          grep -q audio mav_out.txt
          # the resume appended the tail: the file runs most of the ~4 s
          # reference, not just the 2 segments finished before the break
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 mav_out.ts | cut -d. -f1)
          test "${dur:-0}" -ge 3


  # ---------------------------------------------------------- e2isubparser
  # Old C (VLC / ffmpeg snippets from ~2015). Goal: it links into a loadable
  # module and parses SRT + TTML (the TTML path goes through Expat).
  e2isubparser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install python dev headers
        run: sudo apt-get update && sudo apt-get -y install python3-dev
      - name: make
        run: make -C e2isubparser CFLAGS="-w"
      - name: parse SRT and TTML (exercises Expat)
        working-directory: e2isubparser
        env:
          # abort + report on any heap corruption, so the huge-cue test below
          # fails loudly if the markup buffer ever overflows again
          MALLOC_CHECK_: "3"
        run: |
          python3 - <<'PY'
          import _subparser
          print("version:", _subparser.version())

          srt = "1\n00:00:01,000 --> 00:00:02,000\nHello world\n\n"
          r = _subparser.parse(srt, 0, 1, 1, 12, 138)
          print("srt:", r)
          assert r, "SRT parse returned nothing"

          ttml = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<tt xmlns="http://www.w3.org/ns/ttml">'
              '<body><div>'
              '<p begin="00:00:01.000" end="00:00:03.000">Ampersand &amp; entity</p>'
              '<p begin="00:00:04.000" end="00:00:06.000">second cue</p>'
              '</div></body></tt>'
          )
          r = _subparser.parse(ttml, 0, 1, 1, 12, 138)
          print("ttml:", r)
          assert r, "TTML parse returned nothing"

          # a single cue far longer than the internal markup buffer, with
          # lots of <b>/<font> tags and unterminated '<' - must not overflow
          huge = ("1\n00:00:01,000 --> 00:00:05,000\n"
                  + ("<b>x</b> <font size=\"20\">y</font> z <<<< " * 400)
                  + "\n\n")
          r = _subparser.parse(huge, 0, 1, 1, 12, 138)
          print("huge cue len:", len(r["list"][0]["text"]))
          assert r["list"], "huge SRT parse returned nothing"
          assert len(r["list"][0]["text"]) < 4096, "markup buffer not bounded"

          # a cue longer than the markup buffer, cut inside a multi-byte
          # character, must still give a valid list (no NULL entry / error)
          umlaut = "1\n00:00:01,000 --> 00:00:05,000\n" + ("\u00e4" * 3000) + "\n\n"
          r = _subparser.parse(umlaut, 0, 1, 1, 12, 138)
          assert r["list"] and isinstance(r["list"][0]["text"], str), "cut UTF-8 cue"

          # a cue without end time: the last one must end after it starts
          mdvd = "{25}{}first\n{50}{}last cue\n"
          r = _subparser.parse(mdvd, 40000, 1, 1, 12, 138)
          print("microdvd:", r)
          last = r["list"][-1]
          assert last["end"] > last["start"], "last cue ends before it starts"
          PY
      - name: parsers never loop forever
        working-directory: e2isubparser
        run: |
          python3 - <<'PY'
          import multiprocessing as mp

          def work(s, q):
              import _subparser
              q.put(_subparser.parse(s, 0, 1, 1, 12, 138))

          def parse_with_timeout(s, sec=10):
              q = mp.Queue()
              p = mp.Process(target=work, args=(s, q))
              p.start()
              p.join(sec)
              if p.is_alive():
                  p.terminate()
                  raise SystemExit("parser did not finish within %d s: %r" % (sec, s[:80]))
              return q.get(timeout=5)

          # several SAMI SYNC entries on one line used to repeat the first one forever
          sami = "<SAMI><BODY><SYNC Start=1000><P>Hi<SYNC Start=2000><P>there<SYNC Start=3000><P>&nbsp;</BODY></SAMI>"
          r = parse_with_timeout(sami)
          print("sami:", r)
          assert [c["start"] for c in r["list"]][:2] == [1000, 2000], "SAMI entries"

          # malformed SRT-like input found by fuzzing (hung before the fix)
          fuzz = (":199]:99:,799 -->: -1:00:00,&000\nx\n\n2001-> m3> \n\n:00:01,000 \n0:00:1-> > \n\n\n"
                  "9,9[,99 --> -1:00:00,&00\nx\n\n26\n00:00:01,000 \n00:00:\\01-> m3> \n\n")
          parse_with_timeout(fuzz)
          print("fuzz case finished")

  # ----------------------------------------------------------- cmdwrap / lsdir
  small-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: make
        run: |
          set -eux
          make -C cmdwrap
          make -C lsdir
          ./lsdir/lsdir . >/dev/null
          ./lsdir/lsdir --version | grep -qE '^lsdir v[0-9]'
      - name: README component-version badges match the sources
        run: |
          set -eu
          check() {
            grep -qF "img.shields.io/badge/$1-$2-blue" README.md \
              || { echo "README 'Component versions' badge for $1 is not $2" >&2; exit 1; }
          }
          check hlsdl        "$(grep -oE 'hlsdl v[0-9.]+' hlsdl/src/misc.c | head -1 | sed 's/hlsdl //')"
          check e2isubparser "$(grep -oE '"[0-9]+\.[0-9]+"' e2isubparser/src/subparsermodule.c | head -1 | tr -d '"')"
          check lsdir        "$(grep -oE '"[0-9.]+"' lsdir/src/lsdir.c | head -1 | tr -d '"')"
          check cmdwrap      "$(grep -oE 'Version: [0-9]+' cmdwrap/src/cmdwrap.c | grep -oE '[0-9]+')"
          check f4mdump      "$(grep -oE 'F4MDump v[0-9.]+' f4mdump/src/main.cpp | sed 's/F4MDump //')"

  # --------------------------------------------------------------- cppcheck
  # Static analysis of the C we maintain (not the vendored expat / vlc /
  # ffmpeg / librtmp trees). Informational - it does not fail the build.
  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install cppcheck
        run: sudo apt-get update && sudo apt-get -y install cppcheck
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability --inline-suppr --std=c11 \
                   --suppress=missingIncludeSystem --suppress=missingInclude \
                   hlsdl/src cmdwrap/src lsdir/src

  # ---------------------------------------------------------------- f4mdump
  # f4mdump has no build file in the repo: build it from the same sources and
  # with the same compiler flags as the OE recipe
  # (enigma2-plugin-extensions-e2iplayer-deps.bb, S5/S6), libraries last for
  # the as-needed linker. Then let it list the qualities of a local HDS
  # manifest - that runs the vendored TinyXML-2 on a real document.
  f4mdump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install build deps
        run: sudo apt-get update && sudo apt-get -y install libssl-dev zlib1g-dev
      - name: build
        working-directory: f4mdump
        run: |
          set -eux
          # compiler errors also go out as annotations (readable without the log)
          report() { grep -E 'error|undefined reference' build.log | head -n 30 | sed 's/^/::error::/'; exit 1; }
          gcc ext/librtmp/amf.c ext/librtmp/hashswf.c ext/librtmp/log.c \
              ext/librtmp/parseurl.c ext/librtmp/rtmp.c \
              -c -fdata-sections -ffunction-sections -Os \
              -Wno-incompatible-pointer-types -Iext/librtmp > build.log 2>&1 || report
          g++ src/b64.c src/F4mDownloader.cpp src/F4mProcessor.cpp \
              src/ManifestParser.cpp src/RTMPTypes.cpp src/RTMPWrapper.cpp \
              src/SimpleFunctions.cpp src/StreamReader.cpp src/StringHelper.cpp \
              src/UdsDownloader.cpp src/console.cpp src/main.cpp src/parser.cpp \
              src/tinyxml2.cpp \
              -Os -Wno-narrowing -std=c++0x -Iinc -Iext -Iext/librtmp \
              *.o -o f4mdump -lssl -lcrypto -lz > build.log 2>&1 || report
          # printInf() writes to stderr
          ./f4mdump 2>&1 | grep -qE '^F4MDump v[0-9]'
      - name: list qualities of a local HDS manifest
        working-directory: f4mdump
        run: |
          set -eux
          mkdir -p /tmp/hds
          cat > /tmp/hds/manifest.f4m <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest xmlns="http://ns.adobe.com/f4m/1.0">
            <baseURL>http://127.0.0.1:8765</baseURL>
            <bootstrapInfo profile="named" id="boot_low">AAAAAA==</bootstrapInfo>
            <bootstrapInfo profile="named" id="boot_high">AAAAAA==</bootstrapInfo>
            <media streamId="high" url="high" bitrate="1500" bootstrapInfoId="boot_high"/>
            <media streamId="low" url="low" bitrate="500" bootstrapInfoId="boot_low"/>
          </manifest>
          EOF
          (cd /tmp/hds && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/manifest.f4m >/dev/null && break; sleep 0.5; done
          out=$(./f4mdump "wget -q" "http://127.0.0.1:8765/manifest.f4m" 2>&1)
          echo "$out"
          echo "$out" | grep -qF '"qualities":[500, 1500]'
